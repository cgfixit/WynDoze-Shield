name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Python quality
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            constraints.txt
      - name: Install quality tools
        # Keep the ALL lint policy stable as Ruff adds rules in new releases.
        run: python -m pip install -e ".[server,dev]" "ruff==0.17.1"
      - name: Check design invariants
        run: python .agents/skills/invariant-guard/check_invariants.py
      - name: Verify invariant checker
        run: bash .agents/skills/invariant-guard/verify.sh
      - name: Lint
        run: python -m ruff check src tests
      - name: Check formatting
        run: python -m ruff format --check src tests
      - name: Type check
        run: python -m mypy src
      - name: Type check Windows paths
        run: python -m mypy --platform win32 src
      - name: Run Linux regressions with coverage
        run: python -m pytest -q --cov=wyndoze_infoscanoverload --cov-report=term-missing --cov-fail-under=80
      - name: Build wheel
        run: python -m pip wheel --no-deps --wheel-dir dist .

  windows:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    # Hosted images cover Server 2022/2025 x64. Windows 10/11 and Server
    # 2016/2019 still require native acceptance on those operating systems.
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    defaults:
      run:
        shell: pwsh
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025]
        python: ['3.12', '3.13', '3.14', '3.15']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
          architecture: x64
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            constraints.txt
      - name: Install package and dependencies
        # Non-editable installation exercises the wheel and its bundled YAML.
        run: python -m pip install ".[server,dev]"
      - name: Check installed entrypoint and bundled rules
        run: |
          WynDoze-InfoScanOverload-agent version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -c "from wyndoze_infoscanoverload.core.rulepacks import default_rule_pack; pack = default_rule_pack(); assert pack.rules; print(f'{pack.name}: {len(pack.rules)} rules')"
      - name: Parse deployment scripts with Windows PowerShell 5.1
        if: matrix.python == '3.12'
        shell: powershell
        run: |
          foreach ($file in Get-ChildItem deploy/windows -Filter *.ps1 -Recurse) {
            $tokens = $null
            $parseErrors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile(
              $file.FullName, [ref]$tokens, [ref]$parseErrors)
            if ($parseErrors.Count -gt 0) {
              $parseErrors | ForEach-Object { Write-Error $_.Message }
              exit 1
            }
          }
      - name: Verify the task installer contract without registering a task
        # Synthetic fixture: mocks task registration and icacls, checks the
        # native ScheduledTasks parameter metadata, registers nothing.
        if: matrix.python == '3.12'
        shell: powershell
        run: ./tests/windows/Test-TaskInstaller.ps1
      - name: Run regression checks
        run: python -m pytest -q --basetemp "$env:RUNNER_TEMP/wyndoze-pytest"
