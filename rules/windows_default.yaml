# WynDoze-InfoScanOverload default rule pack v1.3.
name: windows-default
version: "1.3"

rules:
  # --- Exposed remote-access / lateral-movement surface ----------------------
  - id: net-rdp-listener
    title: RDP listener exposed
    kind: listening_port
    severity: medium
    category: exposed_service
    message: Remote Desktop (3389) is listening. Verify it is required and firewalled.
    technique: T1021.001
    ports: [3389]

  - id: net-smb-listener
    title: SMB listener exposed
    kind: listening_port
    severity: medium
    category: exposed_service
    message: SMB (445) is listening. Confirm the host is not internet-reachable; SMB is the primary lateral-movement and ransomware-spread vector.
    technique: T1021.002
    ports: [445]

  - id: net-rpc-netbios-listener
    title: RPC/NetBIOS listener exposed
    kind: listening_port
    severity: low
    category: exposed_service
    message: RPC endpoint mapper (135) or NetBIOS session service (139) is listening. Restrict to trusted subnets.
    technique: T1021.003
    ports: [135, 139]

  - id: net-mssql-listener
    title: Database listener exposed
    kind: listening_port
    severity: medium
    category: exposed_service
    message: MSSQL (1433) or MySQL (3306) is listening on this host. Database ports should not be exposed on backup/general endpoints.
    technique: T1021
    ports: [1433, 3306]

  - id: net-winrm-listener
    title: WinRM listener exposed
    kind: listening_port
    severity: medium
    category: exposed_service
    message: WinRM (5985/5986) is listening. Restrict to management subnets.
    technique: T1021.006
    ports: [5985, 5986]

  - id: net-legacy-cleartext
    title: Legacy cleartext service exposed
    kind: listening_port
    severity: high
    category: exposed_service
    message: FTP/Telnet (21/23) listening. Cleartext protocols should not run on backup infra.
    technique: T1071
    ports: [21, 23]

  - id: net-vnc-or-bindshell
    title: VNC or common bind-shell port exposed
    kind: listening_port
    severity: high
    category: exposed_service
    message: Port 5900 (VNC), 4444 (a common bind shell), or 6667 (unencrypted IRC, a common C2 channel) is listening.
    technique: T1219
    ports: [5900, 4444, 6667]

  - id: net-rdp-on-backup-server
    title: RDP exposed on a backup server
    kind: listening_port
    severity: high
    category: exposed_service
    message: RDP is listening on a backup server. This is a high-value lateral-movement target.
    technique: T1021.001
    roles: [backup_server, repository]
    ports: [3389]

  # --- Dual-use / offensive tooling -------------------------------------------
  - id: proc-credential-dumping
    title: Credential-dumping tool observed
    kind: process_name
    severity: critical
    category: dual_use_tool
    message: A known credential-dumping tool is running.
    technique: T1003
    names:
      - mimikatz.exe
      - procdump.exe
      - ntdsutil.exe
      - lazagne.exe
      - rubeus.exe
      - sharphound.exe
      - pwdump.exe
      - wce.exe
      - gsecdump.exe
      - nanodump.exe

  - id: proc-malware-adware
    title: Known malware, miner, or adware process observed
    kind: process_name
    severity: critical
    category: malware
    message: A process name associated with malware, coin miners, or bundled adware is running.
    technique: T1496
    names:
      - xmrig.exe
      - minergate.exe
      - nicehash.exe
      - kmsauto.exe
      - kmspico.exe
      - autokms.exe
      - remcos.exe
      - nanocore.exe
      - quasar.exe
      - asyncrat.exe
      - njrat.exe
      - darkcomet.exe
      - cobaltstrike.exe
      - beacon.exe

  - id: proc-lateral-movement
    title: Lateral-movement / remote-exec tool observed
    kind: process_name
    severity: high
    category: dual_use_tool
    message: A remote-execution utility often used for lateral movement is running.
    technique: T1570
    names:
      - psexec.exe
      - psexesvc.exe
      - paexec.exe
      - wmic.exe
      - wmiexec.exe

  - id: proc-defense-evasion
    title: Recovery or event-log administration utility observed
    kind: process_name
    severity: low
    category: defense_evasion
    message: An administration utility is running. Its process name alone does not establish log clearing, recovery inhibition, or tampering; confirm its use.
    technique: T1070
    names:
      - wevtutil.exe
      - vssadmin.exe
      - diskshadow.exe
      - bcdedit.exe

  - id: proc-exfil-archiver
    title: Archiver / exfiltration tool observed
    kind: process_name
    severity: medium
    category: dual_use_tool
    message: An archiving or sync tool sometimes abused for staging/exfiltration is running.
    technique: T1560
    names:
      - rclone.exe
      - winrar.exe
      - 7z.exe
      - megacmd.exe

  - id: proc-remote-access-software
    title: Third-party remote-access software observed
    kind: process_name
    severity: medium
    category: remote_access
    message: Third-party remote-access software is running. Confirm it is sanctioned.
    technique: T1219
    names:
      - anydesk.exe
      - teamviewer.exe
      - screenconnect.exe
      - rustdesk.exe
      - ngrok.exe
      - ngrok-stable.exe

  # --- Installed software ------------------------------------------------------
  - id: sw-remote-access-installed
    title: Remote-access software is installed
    kind: software_present
    severity: medium
    category: remote_access
    message: Remote-access software is installed. Confirm it is sanctioned.
    technique: T1219
    substrings:
      - tightvnc
      - realvnc
      - ultravnc
      - rustdesk
      - anydesk
      - teamviewer
      - screenconnect
      - logmein
      - gotoassist
      - splashtop
      - ammyy
      - connectwise
      - kaseya
      - dameware

  - id: sw-tunnel-software
    title: Tunnel / port-forwarding software is installed
    kind: software_present
    severity: high
    category: remote_access
    message: A tunneling or port-forwarding tool is installed. These are frequently abused for C2 and exfiltration.
    technique: T1572
    substrings:
      - ngrok
      - cloudflared
      - localtonet
      - pagekite
    names: [frp, chisel]

  - id: sw-pup-adware
    title: Adware or risky bundled software is installed
    kind: software_present
    severity: medium
    category: adware
    message: Installed software often bundles adware or is a common piracy tool.
    substrings:
      - kmspico
      - kmsauto
      - driver booster
      - advanced systemcare
      - segurazo
      - spyhunter
      - restoro
      - reimage
      - searchprotect

  - id: sw-potentially-suspicious
    title: Potentially suspicious software is installed
    kind: software_present
    severity: low
    category: adware
    message: This software is common for administration or file transfer and is also commonly used by attackers. It is not malware by itself.
    substrings:
      - utorrent
      - bittorrent
      - putty
      - filezilla
      - winscp
      - mobaxterm
      - bitvise
      - cyberduck
      - powershell empire
      - bloodhound
      - crackmapexec
      - netexec
    names:
      - kitty

  # --- Services ----------------------------------------------------------------
  - id: svc-remote-access
    title: Remote-access service is present
    kind: service_present
    severity: medium
    category: remote_access
    message: A remote-access service is installed. Confirm it is sanctioned.
    technique: T1219
    substrings:
      - teamviewer
      - anydesk
      - screenconnect
      - rustdesk
      - logmein
      - splashtop

  - id: svc-risky-windows
    title: Risky Windows service is running
    kind: service_present
    severity: high
    category: posture
    message: Remote Registry or Telnet is running. That exposes the host to lateral movement.
    technique: T1021
    states: [running]
    names:
      - remoteregistry
      - tlntsvr

  - id: svc-defender-or-mde-stopped
    platforms: [windows]
    title: Endpoint protection service is not running
    kind: service_present
    severity: low
    category: posture
    message: WinDefend or Sense exists but is stopped. Active, passive, disabled, and third-party protection configurations vary; check configured policy and protection state. Service state alone does not establish tampering.
    states: [stopped]
    names:
      - windefend
      - sense

  - id: svc-windows-update-stopped
    platforms: [windows]
    title: Windows Update service is not running
    kind: service_present
    severity: low
    category: posture
    message: Windows Update is stopped. Trigger-start services may normally be idle; verify update policy and patch status before treating this as a problem.
    states: [stopped]
    names:
      - wuauserv

  - id: svc-spooler-on-server
    platforms: [windows]
    title: Print Spooler running on a server
    kind: service_present
    severity: high
    category: posture
    message: The Print Spooler service is running on a server role. Spooler is a recurrent privilege-escalation vector (PrintNightmare class) and is rarely needed on backup/DC roles.
    technique: T1068
    roles: [backup_server, repository, domain_controller]
    states: [running]
    names:
      - spooler

  # --- Command-line heuristics (opt-in, sealed) ---------------------------------
  # NOTE: flags referenced here must exist in agent/cmdline.py::_FLAG_PATTERNS.
  # New command-line heuristics require an agent code change first.
  - id: cmd-suspicious-line
    title: Suspicious command-line pattern observed
    kind: cmdline_flag
    severity: high
    category: execution
    message: An opted-in command line matched a high-signal pattern. The line itself is not stored in clear text.
    technique: T1059.001
    names:
      - encoded-powershell
      - invoke-expression
      - credential-hive
      - download-cradle
      - execution-policy-bypass
      - hidden-window
      - certutil-download
      - bitsadmin-transfer
      - startup-run-key

  # --- Posture: expected services missing ---------------------------------------
  - id: svc-defender-missing
    platforms: [windows]
    title: Windows Defender service not present
    kind: missing_expected_service
    severity: low
    category: posture
    message: No Windows Defender service was found on the host. AV may be replaced by a third party (verify) or absent entirely.
    names:
      - windefend

  - id: svc-eventlog-missing
    platforms: [windows]
    title: Windows Event Log service not present
    kind: missing_expected_service
    severity: high
    category: posture
    message: The Windows Event Log (EventLog) service was not found. Without event logging, detection and forensics are blind.
    technique: T1562.002
    names:
      - eventlog

  - id: svc-vss-missing-on-backup
    platforms: [windows]
    title: VSS not present on a backup server
    kind: missing_expected_service
    severity: medium
    category: posture
    message: The Volume Shadow Copy service was not found on a backup-role host. Snapshots/backups may not be functioning.
    technique: T1490
    roles: [backup_server, repository]
    names:
      - vss

  # --- Accounts -------------------------------------------------------------------
  - id: admin-unexpected-local-admin
    title: Unexpected local administrator
    kind: local_admin_unexpected
    severity: high
    category: accounts
    message: A local administrator account is present that is not on the approved allow-list.
    technique: T1078
    allow_account_rids: [500, 512]
    allow:
      - administrator
      - domain admins
      - root
